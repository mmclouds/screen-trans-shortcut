<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translation Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="#/today" class="brand">English Review</a>
      <nav class="top-nav" aria-label="Primary navigation">
        <a href="#/today" data-nav="today">Today</a>
        <a href="#/words" data-nav="words">Words</a>
        <a href="#/history" data-nav="history">History</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="container" id="app"></div>
  </main>

  <!-- Image Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <button class="lightbox-close" aria-label="Close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <img src="" alt="Enlarged view" id="lightbox-img">
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/review-state.js"></script>
  <script src="/app.js"></script>
</body>
</html>
